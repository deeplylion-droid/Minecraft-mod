name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the mod jar
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wurstel-mod
          path: build/libs/*.jar

      - name: Publish release with the jar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "Würstel Gigante ${VERSION} (Forge 1.20.1)" \
            --notes "Metti il file .jar nella cartella mods di Minecraft Forge 1.20.1 (47.x)."
