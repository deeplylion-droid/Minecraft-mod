name: Build mods

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Forge 1.20.1 mods build with Java 17, Fabric 1.21.1 mods with Java 21
      # (each mod says which one in gradle.properties: java_version, default 17).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@v4

      # The repository root is the Würstel Gigante mod; every other mod lives in mods/<name>/
      # as its own Gradle project and is built with the root Gradle wrapper.
      - name: Build every mod
        run: |
          chmod +x gradlew
          for dir in . mods/*/; do
            [ -f "$dir/gradle.properties" ] || continue
            java=$(grep '^java_version=' "$dir/gradle.properties" | cut -d= -f2- | tr -d '\r')
            java_home_var="JAVA_HOME_${java:-17}_X64"
            echo "::group::Build $dir (Java ${java:-17})"
            JAVA_HOME="${!java_home_var}" ./gradlew -p "$dir" build --stacktrace --no-daemon
            echo "::endgroup::"
          done

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            build/libs/*.jar
            mods/*/build/libs/*.jar

      # Publishes a release for every jar that has not been published yet.
      # Existing releases and tags are never deleted or changed.
      - name: Publish new versions
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          released=$(gh release list --limit 200 --json tagName -q '.[].tagName' | while read -r tag; do
            gh release view "$tag" --json assets -q '.assets[].name'
          done)
          for dir in . mods/*/; do
            props="$dir/gradle.properties"
            [ -f "$props" ] || continue
            prop() { grep "^$1=" "$props" | cut -d= -f2- | tr -d '\r'; }
            id=$(prop mod_id); name=$(prop mod_name); version=$(prop mod_version); mc=$(prop minecraft_version)
            if [ "$(prop mod_loader)" = "fabric" ]; then
              loader="Fabric"; notes="Metti il file .jar nella cartella mods di Minecraft ${mc} con Fabric Loader. Serve anche Fabric API."
            else
              loader="Forge"; notes="Metti il file .jar nella cartella mods di Minecraft Forge ${mc}."
            fi
            jar_name="${id}-${version}.jar"
            if printf '%s\n' "$released" | grep -qxF "$jar_name"; then
              echo "$jar_name is already published, nothing to do"
              continue
            fi
            gh release create "${id}-v${version}" "$dir/build/libs/$jar_name" \
              --target "$GITHUB_SHA" \
              --title "${name} ${version} (${loader} ${mc})" \
              --notes "$notes"
          done
