// Test-driver mod for Minecraft 26.3 + Fabric (never shipped). Build it with the Gradle wrapper of a
// 26.3 mod (setup.sh copies it here). To read the mod's own classes from the driver, pass its jar:
//   ./gradlew build -PmodJar=/home/user/Minecraft-mod/mods/<mod>/build/libs/<mod_id>-<version>.jar
plugins { id 'net.fabricmc.fabric-loom' version '1.19.1' }
version = '1.0.0'
group = 'ctest'
base { archivesName = 'ctest' }
dependencies {
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.163.0+26.3"
    if (project.hasProperty('modJar')) {
        compileOnly files(project.property('modJar'))
    }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
