// Test-driver mod for Minecraft 1.20.1 + Forge (never shipped). It runs inside the dev clients started
// with runClient, which use Mojang's names: build it with "jar" (not "build"), so it is not reobfuscated.
// setup.sh builds it with the repository's wrapper, passing the mod's compiled classes so the driver can use them:
//   /home/user/Minecraft-mod/gradlew -p <test folder>/ctest jar -PmodJar=/home/user/Minecraft-mod/mods/<mod>/build/classes/java/main
plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '1.0.0'
group = 'ctest'
base { archivesName = 'ctest' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
}
dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.2.0"
    if (project.hasProperty('modJar')) {
        compileOnly files(project.property('modJar'))
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
